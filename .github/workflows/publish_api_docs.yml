name: Profile Android API docs
run-name: Profile Dokka 11.16.2 (${{ inputs.cache_mode }})
on:
  workflow_dispatch:
    inputs:
      cache_mode:
        type: choice
        required: true
        options: [cold, warm]
permissions:
  contents: read
env:
  VERSION: 11.16.2
jobs:
  profile-dokka-11162:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          submodules: true
          token: ${{ secrets.PAT_GITHUB }}

      - name: Ignore dirty runtime submodule worktree
        run: git config --local submodule.submodules/rive-runtime.ignore dirty

      # The Gradle daemon is pinned to JDK 21, and Gradle 8.13 does not support running on JDK 25.
      # Selecting the Ubuntu runner's preinstalled JDK 21 also avoids a separate JDK download.
      - name: Select runner JDK 21
        run: |
          echo "JAVA_HOME=${JAVA_HOME_21_X64:?}" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-write-only: ${{ inputs.cache_mode == 'cold' }}
          cache-read-only: false
          gradle-home-cache-strict-match: true

      - name: Verify expected cache state
        env:
          MODE: ${{ inputs.cache_mode }}
        run: |
          home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          shopt -s nullglob
          wrappers=("$home"/wrapper/dists/gradle-8.13-bin/*/gradle-8.13/bin/gradle)
          dependencies=("$home"/caches/modules-2/files-2.1/org.jetbrains.dokka/*)
          echo "Before Gradle invocation: ${#wrappers[@]} wrappers and ${#dependencies[@]} Dokka modules"
          if [[ "$MODE" == cold ]]; then
            (( ${#wrappers[@]} == 0 && ${#dependencies[@]} == 0 ))
          else
            (( ${#wrappers[@]} > 0 && ${#dependencies[@]} > 0 ))
          fi

      - name: Generate and profile Dokka HTML
        run: |
          ./gradlew -Dorg.gradle.welcome=never :kotlin:dokkaHtml --profile
          test -s kotlin/build/dokka/html/index.html

      - name: Archive Gradle profile
        uses: actions/upload-artifact@v4
        with:
          name: dokka-profile-${{ inputs.cache_mode }}
          path: build/reports/profile/
          if-no-files-found: error
