name: Publish API Docs

# Generates the Dokka HTML API reference and publishes it to the runtime API
# docs bucket, served at https://api-docs.rive.app/android/<version>/ with a
# /android/latest/ alias. Runs in the rive-app/rive-android mirror.
#
# Required repo configuration (rive-app/rive-android):
#   - Environment "runtime-api-docs" (add required reviewers here to gate publishes)
#   - Secret  RUNTIME_API_DOCS_ROLE_ARN        -> terraform output rive_android_api_docs_deploy_role_arn
#   - Variable RUNTIME_API_DOCS_DISTRIBUTION_ID -> terraform output rive_runtime_api_docs_distribution_id

on:
  workflow_call:
    inputs:
      version:
        description: "Published release tag to document"
        required: true
        type: string
    secrets:
      PAT_GITHUB:
        required: true
      RUNTIME_API_DOCS_ROLE_ARN:
        description: "Docs deploy role, also configurable in the runtime-api-docs environment"
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build and publish (e.g. 11.16.3)"
        required: true
        type: string

concurrency:
  group: publish-api-docs-${{ inputs.version }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  S3_BUCKET: rive-runtime-api-docs
  RUNTIME: android
  VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Generate and publish Dokka HTML
    runs-on: ubuntu-latest
    environment: runtime-api-docs
    permissions:
      id-token: write # required to assume the OIDC publish role
      contents: read
    steps:
      - name: Validate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag also becomes one S3 directory directly under android/.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]
          published_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            --jq 'select(.draft == false) | .tag_name')
          if [[ "$published_tag" != "$VERSION" ]]; then
            echo "Expected a published GitHub Release for tag $VERSION" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          submodules: true
          token: ${{ secrets.PAT_GITHUB }}

      - name: Ignore dirty runtime submodule worktree
        run: git config --local submodule.submodules/rive-runtime.ignore dirty

      # GitHub-hosted Ubuntu runners expose preinstalled JDKs via variables such as JAVA_HOME_21_X64.
      # Select the one matching the release's Gradle daemon major to avoid a JDK download.
      - name: Select runner JDK
        shell: bash
        run: |
          criteria=gradle/gradle-daemon-jvm.properties
          major=21 # Preserve the previous launcher for backfills predating daemon criteria.
          if [[ -f "$criteria" ]]; then
            # Gradle writes the JDK major as a property, e.g. toolchainVersion=21.
            major=$(sed -n 's/^toolchainVersion=//p' "$criteria")
            if ! [[ "$major" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Expected a numeric toolchainVersion in $criteria"
              exit 1
            fi
          fi
          variable="JAVA_HOME_${major}_${RUNNER_ARCH}"
          jdk="${!variable:-}"
          if [[ -z "$jdk" || ! -x "$jdk/bin/javac" ]]; then
            echo "::error::The runner has no JDK at $variable for this release"
            exit 1
          fi
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Dokka HTML
        run: ./gradlew -Dorg.gradle.welcome=never kotlin:dokkaHtml

      # v5 specifically: it sends session tags on AssumeRoleWithWebIdentity, which
      # the deploy role's trust policy allows (sts:TagSession). v2 would not tag.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.RUNTIME_API_DOCS_ROLE_ARN }}

      - name: Publish versioned docs to S3
        run: |
          set -euo pipefail
          aws s3 sync kotlin/build/dokka/html "s3://${S3_BUCKET}/${RUNTIME}/${VERSION}/" --delete

      - name: Invalidate versioned docs in CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.RUNTIME_API_DOCS_DISTRIBUTION_ID }}" \
            --paths "/${RUNTIME}/${VERSION}/*"

  promote-latest:
    name: Promote latest API docs
    needs: publish
    runs-on: ubuntu-latest
    environment: runtime-api-docs
    permissions:
      contents: read
      id-token: write
    # All versions share this alias. Check the release after acquiring the lock.
    concurrency:
      group: promote-android-api-docs-latest
      queue: max
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.RUNTIME_API_DOCS_ROLE_ARN }}

      # Backfills of historical releases only write their versioned directory.
      - name: Update latest alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A maintenance patch can be published after a higher minor release.
          # Compare stable X.Y.Z tags across every page of published releases.
          latest=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name |
                    select(test("^(0|[1-9][0-9]*)([.](0|[1-9][0-9]*)){2}$"))' |
              sort -V | tail -n 1
          )
          if [[ "$VERSION" != "$latest" ]]; then
            echo "Skipping alias update for $VERSION (highest stable release: ${latest:-none})"
            exit 0
          fi
          source="s3://${S3_BUCKET}/${RUNTIME}/${VERSION}/"
          alias="s3://${S3_BUCKET}/${RUNTIME}/latest/"
          # A queued release's files can predate the previous promotion. Copy even
          # same-size pages, then remove paths absent from this release.
          aws s3 cp "$source" "$alias" --recursive --copy-props metadata-directive
          aws s3 sync "$source" "$alias" --delete --copy-props metadata-directive
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.RUNTIME_API_DOCS_DISTRIBUTION_ID }}" \
            --paths "/${RUNTIME}/latest/*"
